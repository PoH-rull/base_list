<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ציוד בבסיס</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo" aria-hidden="true">🎖️</div>
    <div class="brand-text">
      <h1 data-i18n="title">ציוד בבסיס</h1>
      <div class="brand-sub" id="topSub"></div>
    </div>
  </div>
  <button class="icon-btn lang-btn" id="langBtn" data-action="toggle-lang" aria-label="Language" hidden>EN</button>
</header>

<main class="main">
  <!-- INVENTORY -->
  <section class="view" id="view-inv">
    <div id="hero"></div>
    <div class="toolbar" id="toolbar">
      <div class="search">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <input id="q" type="search" autocomplete="off" data-i18n-ph="search_ph">
        <button class="search-clear" data-action="clear-q" aria-label="Clear" hidden>✕</button>
      </div>
      <div class="filter-row">
        <div class="seg seg-sm" id="statusSeg" role="tablist">
          <button data-action="status" data-v="all" data-i18n="st_all"></button>
          <button data-action="status" data-v="missing"><span data-i18n="st_missing"></span><span class="seg-count" id="cntMissing"></span></button>
          <button data-action="status" data-v="full" data-i18n="st_full"></button>
        </div>
        <button class="chip chip-loc bag" data-action="loc" data-v="bag">🎒 <span data-i18n="loc_bag"></span></button>
        <button class="chip chip-loc closet" data-action="loc" data-v="closet">🗄️ <span data-i18n="loc_closet"></span></button>
      </div>
      <div class="chips-scroll" id="catChips"></div>
    </div>
    <div id="list"></div>
  </section>

  <!-- PACK -->
  <section class="view" id="view-pack" hidden>
    <div id="packHero"></div>
    <div id="packList"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="view-settings" hidden></section>
</main>

<button class="fab" id="fab" data-action="add"><span class="fab-plus" aria-hidden="true">+</span><span data-i18n="fab"></span></button>

<nav class="tabbar" aria-label="Main">
  <div class="tabbar-inner">
    <button class="tab" data-action="view" data-v="inv"><span class="tab-ico" aria-hidden="true">📋</span><span data-i18n="tab_inv"></span></button>
    <button class="tab" data-action="view" data-v="pack"><span class="tab-ico" aria-hidden="true">🧳</span><span data-i18n="tab_pack"></span><span class="tab-badge" id="packBadge" hidden></span></button>
    <button class="tab" data-action="view" data-v="settings"><span class="tab-ico" aria-hidden="true">⚙️</span><span data-i18n="tab_settings"></span></button>
  </div>
</nav>

<!-- ITEM SHEET (add + edit) -->
<div class="overlay" id="itemSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="isTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2 id="isTitle"></h2>
      <button class="icon-btn" data-action="close-sheet" aria-label="Close">✕</button>
    </div>

    <label class="field">
      <span class="field-label" data-i18n="f_name"></span>
      <input class="input input-lg" id="fName" autocomplete="off" enterkeyhint="done" data-i18n-ph="f_name_ph">
    </label>
    <div class="dup-hint" id="dupHint" hidden></div>

    <div class="field">
      <span class="field-label" data-i18n="f_kind"></span>
      <div class="kind-pick" id="fKind"></div>
    </div>

    <div class="qty-grid" id="fQtyGrid">
      <div class="qbox">
        <span class="field-label" data-i18n="f_target"></span>
        <div class="big-stepper">
          <button data-action="f-step" data-f="target" data-d="-1" aria-label="-1">−</button>
          <input id="fTarget" type="number" inputmode="numeric" min="1">
          <button data-action="f-step" data-f="target" data-d="1" aria-label="+1">+</button>
        </div>
      </div>
      <div class="qbox" id="fQtyBox">
        <span class="field-label" data-i18n="f_qty"></span>
        <div class="big-stepper">
          <button data-action="f-step" data-f="qty" data-d="-1" aria-label="-1">−</button>
          <input id="fQty" type="number" inputmode="numeric" min="0">
          <button data-action="f-step" data-f="qty" data-d="1" aria-label="+1">+</button>
        </div>
      </div>
    </div>
    <div class="qty-hint" id="qtyHint"></div>

    <div class="use-row" id="fUseRow" hidden>
      <span data-i18n="f_use_a"></span>
      <div class="mini-stepper">
        <button data-action="f-step" data-f="useN" data-d="-1" aria-label="-1">−</button>
        <input id="fUseN" type="number" inputmode="numeric" min="1">
        <button data-action="f-step" data-f="useN" data-d="1" aria-label="+1">+</button>
      </div>
      <span data-i18n="f_use_b"></span>
      <div class="mini-stepper">
        <button data-action="f-step" data-f="useEvery" data-d="-1" aria-label="-1">−</button>
        <input id="fUseEvery" type="number" inputmode="numeric" min="1">
        <button data-action="f-step" data-f="useEvery" data-d="1" aria-label="+1">+</button>
      </div>
      <span data-i18n="f_use_c"></span>
    </div>

    <div class="field">
      <span class="field-label" data-i18n="f_cat"></span>
      <div class="pick-chips" id="fCats"></div>
      <div class="newcat-row" id="fNewCatRow" hidden>
        <input class="input" id="fNewCat" autocomplete="off" enterkeyhint="done" data-i18n-ph="f_new_cat_ph">
        <button class="btn btn-soft" data-action="f-newcat-ok" data-i18n="add"></button>
      </div>
    </div>

    <div class="field">
      <span class="field-label" data-i18n="f_loc"></span>
      <div class="loc-pick" id="fLoc"></div>
    </div>

    <label class="field">
      <span class="field-label"><span data-i18n="f_note"></span> <small class="opt" data-i18n="optional"></small></span>
      <input class="input" id="fNote" autocomplete="off" enterkeyhint="done" data-i18n-ph="f_note_ph">
    </label>

    <div class="sheet-actions" id="sheetActions"></div>
  </div>
</div>

<!-- CONFIRM -->
<div class="overlay overlay-center" id="confirm" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true">
    <div class="dialog-msg" id="confirmMsg"></div>
    <div class="dialog-sub" id="confirmSub"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" data-action="confirm-no" id="confirmNo"></button>
      <button class="btn btn-danger" data-action="confirm-yes" id="confirmYes"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button class="toast-undo" id="toastUndo" data-action="undo" hidden></button></div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="app.js?v=13"></script>
</body>
</html>
